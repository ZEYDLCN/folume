<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Send to Folume</title>
    <style>
      body { font: 14px system-ui, sans-serif; margin: 16px; min-width: 320px; color: #46241a; }
      label { display: block; font-weight: 600; margin-bottom: 6px; }
      input { width: 100%; box-sizing: border-box; padding: 8px; border: 1px solid #ebcfb9; border-radius: 8px; font: inherit; }
      button { margin-top: 10px; padding: 8px 14px; border: 0; border-radius: 999px; background: #c2512f; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
      p { color: #7a5a4b; }
      #status { margin-top: 8px; min-height: 1.2em; }
    </style>
  </head>
  <body>
    <label for="url">Where is your Folume app?</label>
    <input id="url" type="url" placeholder="https://folume.example.org" autocomplete="off" />
    <button id="save">Save</button>
    <div id="status" role="status"></div>
    <p>Click the toolbar button, or right-click a page, a link or a selected DOI or arXiv id, and choose “Send to Folume”. The app opens with the paper ready to add. Nothing is sent anywhere else.</p>
    <script type="module" src="options.js"></script>
  </body>
</html>
